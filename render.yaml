# Render Blueprint Specification for Kylo Frontend Website
# Reference: https://render.com/docs/blueprint-spec
#
# Free Static Site Deployment for the Kylo Frontend Website.

services:
  - type: web
    name: kylo-frontend
    runtime: static
    buildCommand: cd kylo/ui/web/frontend && npm ci && npm run build
    staticPublishPath: ./kylo/ui/web/dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=4096"
    routes:
      # Single Page Application (SPA) routing: fallback all routes to index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
