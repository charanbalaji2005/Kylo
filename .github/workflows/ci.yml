name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests & CLI Validation (Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        shell: bash
        run: |
          uv pip install --system -e ".[desktop]" pytest pytest-asyncio

      - name: Verify CLI Command Names and Identity
        shell: bash
        run: |
          pytest tests/unit/core/test_branding.py tests/unit/core/test_command_name.py tests/unit/core/test_identity_single_source.py

      - name: Test klyo CLI execution
        shell: bash
        run: |
          python -m kylo --help
          python -m kylo version

  desktop-lint:
    name: Desktop TypeScript & Build Check
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Desktop UI
        shell: bash
        run: |
          cd desktop
          npm ci
          npm test --if-present
