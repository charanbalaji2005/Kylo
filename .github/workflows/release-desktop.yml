name: Release Desktop App & CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v4.1.4, leave empty to use current git tag)"
        required: false
        default: ""
      draft:
        description: "Mark release as a draft"
        type: boolean
        default: false
      prerelease:
        description: "Mark release as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Release Desktop App (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version & Tag
        id: versioning
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag_name }}"
          if [ -z "$tag" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              tag="$GITHUB_REF_NAME"
            else
              tag="v4.1.4"
            fi
          fi
          clean_version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${clean_version}" >> "$GITHUB_OUTPUT"
          echo "Releasing tag: ${tag} (version: ${clean_version})"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Python Backend Dependencies
        shell: bash
        run: |
          echo "Installing Python dependencies with uv..."
          uv pip install --system --upgrade pip setuptools wheel pyinstaller
          uv pip install --system -e ".[desktop]"

      - name: Build Web UI Frontend
        shell: bash
        run: |
          echo "Building React Web UI frontend..."
          cd kylo/ui/web/frontend
          npm ci
          npm run build

      - name: Freeze Python Backend with PyInstaller
        shell: bash
        run: |
          echo "Freezing backend using kylo.spec..."
          python -m PyInstaller kylo.spec --noconfirm --clean
          if [ ! -d "dist/Jarvis" ]; then
            echo "::error::dist/Jarvis was not produced by PyInstaller"
            exit 1
          fi
          echo "PyInstaller output verified:"
          ls -la dist/Jarvis/*.exe

      - name: Package CLI Distribution (kylo & klyo CLI tools)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist/cli-package" -Force | Out-Null
          Copy-Item -Path "dist/Jarvis/*" -Destination "dist/cli-package" -Recurse -Force
          Compress-Archive -Path "dist/cli-package/*" -DestinationPath "dist/kylo-cli-windows-x64.zip" -Force
          Copy-Item "dist/kylo-cli-windows-x64.zip" "dist/klyo-cli-windows-x64.zip" -Force
          Write-Host "Created dist/kylo-cli-windows-x64.zip and dist/klyo-cli-windows-x64.zip"

      - name: Build Electron Desktop Installer
        shell: pwsh
        run: |
          cd desktop
          npm ci
          $ver = "${{ steps.versioning.outputs.version }}"
          npm version $ver --no-git-tag-version --allow-same-version
          npm run build
          npx electron-builder --win nsis --x64 --publish never
          cd ..
          if (-not (Test-Path "desktop/release")) {
            Write-Error "desktop/release directory was not created"
            exit 1
          }
          # Create Klyo alias setup alongside Kylo setup
          Get-ChildItem -Path "desktop/release" -Filter "*Setup*.exe" | ForEach-Object {
            $src = $_.FullName
            $klyoName = $_.Name -ireplace "Kylo", "Klyo"
            if ($klyoName -ne $_.Name) {
              Copy-Item -Path $src -Destination (Join-Path "desktop/release" $klyoName) -Force
              Write-Host "Created alias setup: $klyoName"
            }
          }

      - name: Generate Checksums
        shell: pwsh
        run: |
          $releaseFiles = @()
          $releaseFiles += Get-ChildItem -Path "desktop/release" -Filter "*.exe"
          $releaseFiles += Get-ChildItem -Path "dist" -Filter "*-cli-*.zip"
          $lines = @()
          foreach ($file in $releaseFiles) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += "$hash  $($file.Name)"
            Write-Host "$hash  $($file.Name)"
          }
          $lines | Set-Content -Path "SHA256SUMS.txt" -Encoding utf8

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-windows-x64
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            dist/*-cli-*.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: "Release ${{ steps.versioning.outputs.tag }}"
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            dist/*-cli-*.zip
            SHA256SUMS.txt
